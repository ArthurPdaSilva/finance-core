name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finance_test
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      API_KEY: test-api-key
      DATABASE_URL: postgresql+psycopg://finance:finance@127.0.0.1:5432/finance_test
      DATABASE_NAME: finance_test
      LANGFUSE_HOST: https://cloud.langfuse.com
      LANGFUSE_PUBLIC_KEY: pk-lf-test
      LANGFUSE_SECRET_KEY: sk-lf-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Check lockfile
        run: uv lock --check

      - name: Run Ruff
        run: uv run ruff check src tests

      - name: Run tests
        run: uv run pytest --cov=src --cov-report=term-missing

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm lint

      - name: Run TypeScript checks
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  compose:
    name: Compose build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config -q

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Check backend health
        run: curl --fail --retry 10 --retry-delay 3 http://localhost:8000/health

      - name: Stop services
        if: always()
        run: docker compose down -v
